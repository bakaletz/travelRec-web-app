<div class="auth-page">
  <div class="auth-bg-decor" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-brand">
        <span class="auth-brand-icon">✈</span>
        <h1 class="auth-logo">TravelRec</h1>
      </div>
      <p class="auth-subtitle">Create your account</p>
    </div>

    @if (error) {
      <div class="auth-error" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error }}</span>
      </div>
    }

    <form class="auth-form" (ngSubmit)="onSubmit()">
      <div class="name-row">
        <div class="field">
          <label for="firstName">First Name</label>
          <input pInputText
                 id="firstName"
                 type="text"
                 autocomplete="given-name"
                 [(ngModel)]="firstName"
                 name="firstName"
                 placeholder="John"
                 class="auth-input">
        </div>
        <div class="field">
          <label for="lastName">Last Name</label>
          <input pInputText
                 id="lastName"
                 type="text"
                 autocomplete="family-name"
                 [(ngModel)]="lastName"
                 name="lastName"
                 placeholder="Doe"
                 class="auth-input">
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input pInputText
               id="email"
               type="email"
               autocomplete="email"
               [(ngModel)]="email"
               name="email"
               placeholder="you@example.com"
               class="auth-input">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <p-password id="password"
                    [(ngModel)]="password"
                    name="password"
                    [toggleMask]="true"
                    placeholder="Min. 6 characters"
                    styleClass="auth-password"
                    inputStyleClass="auth-input">
        </p-password>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <p-password id="confirmPassword"
                    [(ngModel)]="confirmPassword"
                    name="confirmPassword"
                    [feedback]="false"
                    [toggleMask]="true"
                    placeholder="Repeat password"
                    styleClass="auth-password"
                    inputStyleClass="auth-input"
                    (keyup.enter)="onSubmit()">
        </p-password>
      </div>

      <p-button label="Create Account"
                type="submit"
                [loading]="loading"
                (onClick)="onSubmit()"
                styleClass="auth-submit">
      </p-button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/login" class="auth-link">Sign In</a>
    </div>
  </div>
</div>
